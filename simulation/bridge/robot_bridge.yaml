# robot_bridge.yaml — reference gz ↔ ROS 2 bridge config (5 robots, Phase 1).
#
# The multi_robot.launch.py GENERATES an equivalent config at launch time for
# whatever robot count it spawns (see _bridge_config_yaml in
# simulation/launch/multi_robot.launch.py). This file is the static reference
# for the default 5-robot setup and is installed by the ament package.
#
# gz topic names VERIFIED against Gazebo Harmonic 8.15 (`gz topic -l`):
#   odometry -> /model/robot_N/odometry (NOT /odom)
#   lidar    -> /world/warehouse_v1/model/robot_N/link/base_link/sensor/lidar/scan
#   imu      -> /world/warehouse_v1/model/robot_N/link/base_link/sensor/imu/imu
#   tf       -> /model/robot_N/tf

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: "GZ_TO_ROS"

# ─── robot_0 ────────────────────────────────────────────────────────────────
- ros_topic_name: "/robot_0/odom"
  gz_topic_name: "/model/robot_0/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: "GZ_TO_ROS"
- ros_topic_name: "/robot_0/cmd_vel"
  gz_topic_name: "/model/robot_0/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: "ROS_TO_GZ"
- ros_topic_name: "/robot_0/scan"
  gz_topic_name: "/world/warehouse_v1/model/robot_0/link/base_link/sensor/lidar/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: "GZ_TO_ROS"
- ros_topic_name: "/robot_0/imu"
  gz_topic_name: "/world/warehouse_v1/model/robot_0/link/base_link/sensor/imu/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: "GZ_TO_ROS"
- ros_topic_name: "/robot_0/tf"
  gz_topic_name: "/model/robot_0/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: "GZ_TO_ROS"


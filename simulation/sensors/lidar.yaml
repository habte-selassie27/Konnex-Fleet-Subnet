# lidar.yaml — LiDAR sensor configuration (Phase 1).
# Status: COMPLETE — spec from BUILD.md §4; mirrors the gpu_lidar sensor
# declared in simulation/robots/amr_model.urdf.xacro.

type: gpu_lidar          # gz-sim GPU ray sensor
update_rate_hz: 10       # 10 Hz
frame_id: lidar_link
topic: scan

scan:
  horizontal:
    samples: 360         # 360 beams
    resolution: 1        # 1° resolution
    min_angle_rad: -3.14159
    max_angle_rad: 3.14159
  range:
    min_m: 0.1
    max_m: 10.0
    resolution_m: 0.01

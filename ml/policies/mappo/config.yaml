# ml/policies/mappo/config.yaml — MAPPO training config (BUILD.md §7)

experiment:
  id: "exp_004"
  name: "fleet-mappo"
  seed: 42

scenario:
  robot_count: 5
  task_count: 20
  obstacle_count: 15
  time_limit_s: 600.0

algorithm:
  n_agents: 5
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.015
  total_timesteps: 5_000_000
  eval_freq: 50_000
  n_eval_episodes: 10
  seed: 42

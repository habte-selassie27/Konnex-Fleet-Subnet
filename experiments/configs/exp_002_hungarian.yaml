# exp_002 — Hungarian Optimal Assignment (Phase 3)
experiment:
  id: "exp_002"
  name: "Hungarian Optimal Assignment"
  policy: "hungarian"

scenario:
  world: "warehouse_v1"
  robot_count: 5
  task_count: 20
  seed_range: [1000, 1029]
  obstacle_count: 15
  battery_range: [0.6, 1.0]
  failure_injection: false

execution:
  time_limit_s: 600
  runs_per_seed: 1

output:
  results_dir: "experiments/results/exp_002"
  save_trajectories: true
  save_telemetry: true

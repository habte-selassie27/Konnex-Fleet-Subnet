# exp_006 — Fleet scaling study (Phase 5)
experiment:
  id: "exp_006"
  name: "Fleet Scaling (5 / 10 / 20 robots)"
  policy: "cost_optimizer"

scenario:
  world: "warehouse_v1"
  robot_counts: [5, 10, 20]
  task_count: 40
  seed_range: [1000, 1004]
  obstacle_count: 15
  battery_range: [0.6, 1.0]
  failure_injection: false

execution:
  time_limit_s: 600
  runs_per_seed: 1

output:
  results_dir: "experiments/results/exp_006"
  save_trajectories: true
  save_telemetry: true
